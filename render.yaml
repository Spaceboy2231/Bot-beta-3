services:
  - type: web
    name: checker-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python fix.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "10000"
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: KEY_ADMINS
        sync: false
      - key: CHANNEL_USERNAME
        value: "THENETWORKOFLEO"
      - key: TZ
        value: "Asia/Dhaka"
