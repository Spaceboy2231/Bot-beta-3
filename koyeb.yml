name: checker-bot
services:
  - name: checker-bot
    instance_type: nano
    source:
      type: git
      branch: main
    env:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: "Asia/Dhaka"
    ports:
      - port: 80
        protocol: http
    deployment_strategy: rolling
    healthcheck:
      interval: 60
      timeout: 10
      retries: 3
